[project]
site_name = "bound-entangled"
site_url = "https://avlyx.github.io/bound-entangled/"
site_description = "Families of bound entangled states from the quantum information literature, as NumPy density matrices."
site_author = "Anton Van Cleemput"
copyright = "Copyright &copy; 2026 Anton Van Cleemput — released under the <a href=\"https://github.com/AVlyx/bound-entangled/blob/main/LICENSE\">MIT License</a>"

repo_url = "https://github.com/AVlyx/bound-entangled"
repo_name = "AVlyx/bound-entangled"
edit_uri = "edit/main/docs/"

nav = [
  { "Introduction" = "index.md" },
  { "C² ⊗ C⁴" = [
    { "Horodecki 2 ⊗ 4" = "states/c2-c4/horodecki.md" },
  ] },
  { "C³ ⊗ C³" = [
    { "Horodecki 3 ⊗ 3" = "states/c3-c3/horodecki.md" },
    { "Chessboard" = "states/c3-c3/chessboard.md" },
    { "Cross-hatch" = "states/c3-c3/cross-hatch.md" },
    { "Vértesi–Brunner" = "states/c3-c3/vertesi-brunner.md" },
    { "Steering state" = "states/c3-c3/steering.md" },
    { "Unextendible product bases" = [
      { "Tiles" = "states/c3-c3/upb/tiles.md" },
      { "Pyramid" = "states/c3-c3/upb/pyramid.md" },
      { "Parametrized" = "states/c3-c3/upb/parametrized.md" },
    ] },
  ] },
  { "C⁴ ⊗ C⁴" = [
    { "Piani" = "states/c4-c4/piani.md" },
  ] },
  { "C⁵ ⊗ C⁵" = [
    { "SN3 grid state" = "states/c5-c5/sn3-grid-state.md" },
  ] },
  { "Cᵈ ⊗ Cᵈ" = [
    { "Horodecki 2 ⊗ d" = "states/cd-cd/horodecki-2-d.md" },
    { "GenTiles1" = "states/cd-cd/gen-tiles-1.md" },
    { "Yu–Oh" = "states/cd-cd/yu-oh.md" },
    { "Badziąg private singlet" = "states/cd-cd/badziag-private-singlet.md" },
    { "Orthogonal singlet" = "states/cd-cd/orthogonal-singlet.md" },
  ] },
  { "Cᵐ ⊗ Cⁿ" = [
    { "Grid state" = "states/cm-cn/grid-state.md" },
    { "Generalized grid state" = "states/cm-cn/generalized-grid-state.md" },
    { "GenTiles2" = "states/cm-cn/gen-tiles-2.md" },
    { "Random states" = "states/cm-cn/random.md" },
  ] },
  { "Multipartite" = [
    { "Smolin" = "states/multipartite/smolin.md" },
    { "Generalized Smolin" = "states/multipartite/generalized-smolin.md" },
    { "Quasi-DS" = "states/multipartite/quasi-ds.md" },
  ] },
  { "Utilities" = "utils.md" },
  { "Bibliography" = "bibliography.md" },
  { "License" = "license.md" },
]

extra_css = [
  "https://unpkg.com/katex@0.16.22/dist/katex.min.css",
]
extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0.16.22/dist/katex.min.js",
  "https://unpkg.com/katex@0.16.22/dist/contrib/auto-render.min.js",
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AVlyx/bound-entangled"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/bound-entangled/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# The bibliography pulls its entries from includes/refs; the license page pulls in LICENSE.
pymdownx.snippets.base_path = ["includes", "."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tilde = {}

# API sections are rendered from the docstrings in src/ by static analysis, so
# building the docs needs neither the package nor toqito installed.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
heading_level = 2
members_order = "source"
separate_signature = true
show_root_heading = false
show_root_full_path = false
show_root_toc_entry = false
show_signature_annotations = true
show_source = true

# Docstrings write "Returns: np.ndarray: ...", so read the part before the colon as a type.
[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
returns_named_value = false
