[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bound-entangled"
version = "0.2.2"
description = "Families of bound entangled states for Quantum Information"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AVlyx", email = "anton@vancleem.com"}
]
dependencies = [
    "toqito>=1.1.8",
    "numpy>=2.4.1"
]

[project.urls]
Homepage = "https://github.com/AVlyx/bound-entangled"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src is both a testpath (every state factory carries doctests asserting it is a
# valid density matrix, PPT, and entangled) and an import path, so the library
# imports the same way the source does even without the editable install.
testpaths = ["src", "tests"]
pythonpath = ["src"]
# importlib mode lets the two identically named `test_upb.py` modules coexist.
addopts = "--import-mode=importlib --doctest-modules"