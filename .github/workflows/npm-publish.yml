# This workflow publishes the js/ package to npm when a release is created,
# using npm trusted publishing (OIDC) — no long-lived npm token required.
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Upload NPM Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: js/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build release package
        run: npm run build

      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: js/dist/

  npm-publish:
    runs-on: ubuntu-latest
    needs:
      - package-build
    defaults:
      run:
        working-directory: js
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: npm
      url: https://www.npmjs.com/package/bound-entangled

    steps:
      - uses: actions/checkout@v4

      - name: Retrieve release dist
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: js/dist/

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Publish to npm
        # --ignore-scripts: build/typecheck/test already ran in package-build,
        # this skips re-running prepublishOnly against a package without devDependencies installed.
        run: npm publish --ignore-scripts
