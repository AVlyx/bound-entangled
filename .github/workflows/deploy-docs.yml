name: deploy-docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "js/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            js/package-lock.json
            docs/package-lock.json

      # docs depends on the local library via "file:../js", so its dist/ must exist first.
      - name: Build library
        working-directory: js
        run: |
          npm ci
          npm run build

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # BrowserRouter deep links 404 on Pages without a fallback copy.
      - name: Add SPA fallback
        run: cp docs/dist/index.html docs/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
